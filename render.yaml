services:
  - type: web
    name: saferoute-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m ml.train_model
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_API_KEY
        sync: false          # set in the Render dashboard, never in git
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
